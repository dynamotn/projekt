[tasks.doc]
description = "Generate documentation"
run = "{{ config_root }}/scripts/doc.sh"

[tasks.test]
description = "Unit test"
run = "{{ config_root }}/scripts/test.sh"

[tasks.coverage]
description = "Unit test with a kcov coverage report"
run = "{{ config_root }}/scripts/test.sh --coverage"

[tasks.demo]
description = "Run demo script"
run = "{{ config_root }}/doc/example.sh --help"

[tasks.release]
description = "Cut a release: stamp, tag, and publish"
run = "{{ config_root }}/scripts/release.sh"
