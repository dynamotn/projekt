name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  lint:
    name: "Repository lint"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # gitleaks scans history, which needs more than the default shallow clone.
          fetch-depth: 0

      - name: "Install dependencies"
        env:
          YQ_VERSION: v4.53.3
          # Pin ShellCheck: the runner image ships 0.9.0, whose SC2317, SC2119,
          # and SC2015 findings on this code are false positives that later
          # versions dropped. A pinned release also keeps a lint failure here
          # reproducible on a developer machine.
          SHELLCHECK_VERSION: v0.11.0
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing gawk jq
          curl -fsSL \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJf - -C /tmp "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          sudo install -m 0755 "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          sudo curl -fsSL -o /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
          shellcheck --version | head -n 2

      - name: "Lint"
        # ShellCheck over every tracked script, Keep a Changelog conformance,
        # generated-documentation drift, and a bundle that still builds and loads.
        run: bash scripts/lint.sh

      - name: "Scan for committed secrets"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container: kcov/kcov
    steps:
      - name: "Install dependencies"
        env:
          # Pin the JSON backend: Debian's `yq` package is a different program
          # with a different expression language, so the Go implementation the
          # library is written against is fetched directly.
          YQ_VERSION: v4.53.3
        run: |
          apt-get update && apt-get install -y --fix-missing git parallel curl netcat-openbsd jq
          curl -fsSL -o /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          chmod +x /usr/local/bin/yq
          yq --version
          jq --version
          useradd test

      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: "Test"
        run: |
          # `su -` resets the environment, so the worker count and the JSON
          # backend are both checked from inside the test user's own shell.
          su - test -c "command -v yq && command -v jq"
          chown -R test $(pwd)
          # kcov never releases the trace state it accumulates, so a single
          # invocation over the whole suite grows until the OOM killer takes the
          # run down with exit 137. `--coverage` runs one invocation per chunk of
          # test files, which keeps the peak at whatever the largest chunk needs.
          #
          # That peak tracks the tests in one chunk (~16 MiB each) and not the
          # worker count: measured over the same files, 2 and 4 workers peaked at
          # 2613 and 2615 MiB. So `--chunk` is the memory knob and `--jobs` is
          # free, which makes one worker per vCPU the right setting -- a standard
          # runner has 4. `scripts/test.sh` balances the chunks by test count, so
          # 5 files per chunk is ~180 tests, or well under 3 GiB of the 16 GiB
          # the runner has.
          su - test -c "DYBATPHO_TEST_JOBS=4 DYBATPHO_TEST_CHUNK=5 bash $(pwd)/scripts/test.sh --coverage"

      - name: "Fix coverage paths"
        # kcov strips the longest common prefix from `filename` and records it in
        # <sources>, which Coveralls ignores. Re-anchor the paths to the repo root.
        run: |
          xml=coverage/bats/cobertura.xml
          sed -i 's#<source>.*</source>#<source>.</source>#' "${xml}"
          for f in $(grep -o 'filename="[^"]*"' "${xml}" | sed 's/^filename="//;s/"$//' | sort -u); do
            case "${f}" in */*) continue ;; esac
            if [ ! -f "${f}" ] && [ -f "src/${f}" ]; then
              sed -i "s#filename=\"${f}\"#filename=\"src/${f}\"#g" "${xml}"
            fi
          done

      - name: "Coveralls"
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          format: "cobertura"
          files: "coverage/bats/cobertura.xml"

  portable:
    name: "Portable smoke tests (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: "Install a modern bash (macOS ships bash 3.2)"
        if: runner.os == 'macOS'
        run: |
          brew list bash > /dev/null 2>&1 || brew install bash
          echo "$(brew --prefix)/bin" >> "${GITHUB_PATH}"
      - name: "Run portable module tests"
        run: |
          command -v bash
          bash --version | head -n 1
          test/lib/core/bin/bats test/os.bats test/date.bats test/file.bats
