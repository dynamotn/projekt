name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container: kcov/kcov
    steps:
      - name: "Install dependencies"
        run: |
          apt-get update && apt-get install -y --fix-missing git parallel curl netcat-openbsd
          useradd test

      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: "Test"
        run: |
          chown -R test $(pwd)
          su - test bash -c $(pwd)/scripts/test.sh

      - name: "Fix coverage paths"
        # kcov strips the longest common prefix from `filename` and records it in
        # <sources>, which Coveralls ignores. Re-anchor the paths to the repo root.
        run: |
          xml=coverage/bats/cobertura.xml
          sed -i 's#<source>.*</source>#<source>.</source>#' "${xml}"
          for f in $(grep -o 'filename="[^"]*"' "${xml}" | sed 's/^filename="//;s/"$//' | sort -u); do
            case "${f}" in */*) continue ;; esac
            if [ ! -f "${f}" ] && [ -f "src/${f}" ]; then
              sed -i "s#filename=\"${f}\"#filename=\"src/${f}\"#g" "${xml}"
            fi
          done

      - name: "Coveralls"
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          format: "cobertura"
          files: "coverage/bats/cobertura.xml"

  portable:
    name: "Portable smoke tests (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: "Install a modern bash (macOS ships bash 3.2)"
        if: runner.os == 'macOS'
        run: |
          brew list bash > /dev/null 2>&1 || brew install bash
          echo "$(brew --prefix)/bin" >> "${GITHUB_PATH}"
      - name: "Run portable module tests"
        run: |
          command -v bash
          bash --version | head -n 1
          test/lib/core/bin/bats test/os.bats test/date.bats test/file.bats
