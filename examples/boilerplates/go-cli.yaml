# b new go-cli myapp
#
# No workspace is set, so a plain name is created in the current folder. Set
# `register.workspace` to the folder your projects live in and `b new go-cli
# myapp` lands there instead, wherever you happen to be.
description: Go CLI with a Makefile, a README and CI-ready layout
source:
  template: go-cli
vars:
  - name: module
    prompt: Go module path
    default: "example.com/{{ .Name }}"
    required: true
  - name: summary
    prompt: What does it do, in one line
  - name: author
    default: "{{ .User }}"
  - name: goVersion
    prompt: Go version
    default: "1.24"
register:
  tags: [go]
