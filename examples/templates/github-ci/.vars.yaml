vars:
  - name: workflow
    prompt: Workflow name
    default: "{{ .Name }}"
  - name: branch
    prompt: Branch it runs on
    default: main
  - name: runner
    type: choice
    choices: [ubuntu-latest, macos-latest, windows-latest]
    default: ubuntu-latest
  - name: goVersion
    prompt: Go version
    default: "1.24"
  - name: publishCoverage
    prompt: Upload the coverage profile
    type: bool
    default: "no"
